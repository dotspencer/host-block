name = "hostblock-download-redirect"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Dedicated download host. custom_domain auto-provisions the proxied DNS record and
# edge TLS cert for download.hostblock.app on deploy — no manual DNS needed. Any
# request to download.hostblock.app redirects to the current DMG.
routes = [
  { pattern = "download.hostblock.app", custom_domain = true }
]

# The only public entrypoint is the custom domain above; don't also expose the
# *.workers.dev URL.
workers_dev = false

[vars]
# The update feed to read; its "url" field is the DMG the redirect hands back.
# Same file the app polls, so /download and in-app updates never drift apart.
FEED_URL = "https://github.com/dotspencer/host-block/releases/latest/download/latest.json"
