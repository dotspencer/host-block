name = "hostblock-license-decrement"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Dedicated custom-domain host for this Worker. custom_domain auto-provisions the
# proxied DNS + TLS cert, and (unlike a path route on a record with a dummy origin)
# there is NO origin to fall through to, so a request can never hang on an unreachable
# backend (which is what the old api.hostblock.app path-route setup risked).
routes = [
  { pattern = "license-decrement.hostblock.app", custom_domain = true }
]

# The only public entrypoint is the route above; don't also expose the
# *.workers.dev URL. Flip to true temporarily if you need to test before DNS is set.
workers_dev = false

# The Gumroad product id is public (the app already sends it in the client-side
# verify call), so it's fine to commit here.
[vars]
GUMROAD_PRODUCT_ID = "feMqfzhFkJO4HvlTTOeYcw=="

# The access token is a SECRET. Never put it here. Set it with:
#   wrangler secret put GUMROAD_ACCESS_TOKEN
